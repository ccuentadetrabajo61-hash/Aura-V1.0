workflows:
  android-build:
    name: Aura Android Release Pipeline
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - production_keys
      vars:
        PACKAGE_NAME: "com.aura.cyberdefense"
      # AURA_PUBLIC_KEY_ENV is injected by production_keys; store only the Base64 DER body there.
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
        - pattern: 'principal'
    scripts:
      - name: Configure JDK 17 and build Android App Bundle (Release)
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}"
          bash tool/compile_aura.sh
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      
