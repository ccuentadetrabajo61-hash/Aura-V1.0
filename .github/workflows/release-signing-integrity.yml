name: Release signing integrity

on:
  pull_request:
    paths:
      - 'android/app/build.gradle'
      - 'tool/compile_aura.sh'
      - '.github/workflows/release-signing-integrity.yml'
  push:
    branches:
      - main
    paths:
      - 'android/app/build.gradle'
      - 'tool/compile_aura.sh'
      - '.github/workflows/release-signing-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-signing-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Configure Flutter SDK path for Gradle
        shell: bash
        run: |
          set -euo pipefail
          flutter_binary="$(command -v flutter)"
          flutter_root="$(cd "$(dirname "$flutter_binary")/.." && pwd -P)"
          properties_tmp="$(mktemp)"
          if [[ -f android/local.properties ]]; then
            awk -F= '$1 != "flutter.sdk" {print}' android/local.properties > "$properties_tmp"
          fi
          printf 'flutter.sdk=%s\n' "$flutter_root" >> "$properties_tmp"
          mv "$properties_tmp" android/local.properties
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Require release signing variables
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(./gradlew :app:printReleaseSigning 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$status" -eq 0 ]]; then
            printf '%s\n' 'Expected printReleaseSigning to fail without signing variables.' >&2
            exit 1
          fi
          for variable in AURA_KEYSTORE_PATH AURA_STORE_PASSWORD AURA_KEY_ALIAS AURA_KEY_PASSWORD; do
            if ! grep -Fq "$variable" <<< "$output"; then
              printf 'Gradle failure did not name %s.\n' "$variable" >&2
              exit 1
            fi
          done
      - name: Reject debug signing in release build type
        shell: bash
        run: |
          set -euo pipefail
          if awk '
            /^[[:space:]]*buildTypes[[:space:]]*\{/ { in_build_types = 1; next }
            in_build_types && /^[[:space:]]*release[[:space:]]*\{/ {
              in_release = 1
              release_found = 1
              depth = 1
              next
            }
            in_release {
              if ($0 ~ /signingConfigs\.debug/) found_debug_signing = 1
              line = $0
              depth += gsub(/\{/, "{", line)
              line = $0
              depth -= gsub(/\}/, "}", line)
              if (depth == 0) in_release = 0
            }
            END { if (!release_found || found_debug_signing) exit 1 }
          ' android/app/build.gradle; then
            printf '%s\n' 'Release build type contains no debug signing reference.'
          else
            printf '%s\n' 'Missing release block or debug signing reference found in it.' >&2
            exit 1
          fi

  release-signing-positive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Configure Flutter SDK path for Gradle
        shell: bash
        run: |
          set -euo pipefail
          flutter_binary="$(command -v flutter)"
          flutter_root="$(cd "$(dirname "$flutter_binary")/.." && pwd -P)"
          properties_tmp="$(mktemp)"
          if [[ -f android/local.properties ]]; then
            awk -F= '$1 != "flutter.sdk" {print}' android/local.properties > "$properties_tmp"
          fi
          printf 'flutter.sdk=%s\n' "$flutter_root" >> "$properties_tmp"
          mv "$properties_tmp" android/local.properties
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Verify release signing with an ephemeral key
        shell: bash
        run: |
          set -euo pipefail
          export AURA_KEYSTORE_PATH="$RUNNER_TEMP/aura-release-signing.jks"
          export AURA_STORE_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
          export AURA_KEY_ALIAS='aura-release-ci'
          export AURA_KEY_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
          trap 'rm -f "$AURA_KEYSTORE_PATH"' EXIT
          echo "::add-mask::$AURA_STORE_PASSWORD"
          echo "::add-mask::$AURA_KEY_PASSWORD"
          keytool -genkeypair -noprompt \
            -alias "$AURA_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 2 \
            -keystore "$AURA_KEYSTORE_PATH" -storetype JKS \
            -storepass "$AURA_STORE_PASSWORD" \
            -keypass "$AURA_KEY_PASSWORD" \
            -dname 'CN=Aura Ephemeral CI Release,O=Aura,C=US'
          cd android
          output="$(./gradlew :app:printReleaseSigning --console=plain)"
          printf '%s\n' "$output"
          grep -Fq "STORE_FILE=$AURA_KEYSTORE_PATH" <<< "$output"
          grep -Fq "KEY_ALIAS=$AURA_KEY_ALIAS" <<< "$output"
          grep -Fq 'IS_DEBUG_SIGNING=false' <<< "$output"